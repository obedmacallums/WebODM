<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="26"
   height="26"
   viewBox="0 0 26 26"
   version="1.1">
  <!-- Marco de referencia (mapa base) -->
  <rect
     x="4.5" y="4.5" width="12" height="12"
     style="fill:none;stroke:#191919;stroke-width:1.2;stroke-dasharray:2,1.5" />
  <!-- Producto desplazado que se realinea -->
  <rect
     x="9.5" y="9.5" width="12" height="12"
     style="fill:#eeeeee;fill-opacity:0.85;stroke:#191919;stroke-width:1.2" />
  <!-- Vector de desplazamiento origen -> destino -->
  <path
     d="M 8,8 L 17,17"
     style="fill:none;stroke:#191919;stroke-width:1.2;stroke-linecap:round" />
  <circle cx="8" cy="8" r="1.8" style="fill:#191919" />
  <path
     d="M 17,17 L 13.5,16 M 17,17 L 16,13.5"
     style="fill:none;stroke:#191919;stroke-width:1.2;stroke-linecap:round" />
</svg>
